<body>
<div id="te-loading" style="min-height:100vh;display:grid;place-items:center;background:#080b11;color:#8f9caf;font:600 12px system-ui">Loading secure control panel…</div>
<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(!tg || !tg.initData){
    document.addEventListener('DOMContentLoaded',()=>{
      document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f4f5;padding:24px;font-family:system-ui,sans-serif"><div style="max-width:420px;background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:24px;text-align:center"><h2 style="margin:0 0 8px">Telegram Control Panel</h2><p style="margin:0;color:#666;font-size:14px">ይህን ገጽ ከTelegram Bot ውስጥ ባለው Control Panel ቁልፍ ብቻ ክፈት።</p></div></div>';
    });
    return;
  }
  try{tg.ready();tg.expand(); setAdminTheme(adminTheme());}catch(e){}
  const realFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:((input&&input.url)||'');
    if(url.indexOf('/api/')===0 || url.indexOf('/uploads/')===0 || url.indexOf(location.origin+'/api/')===0 || url.indexOf(location.origin+'/uploads/')===0){
      init=Object.assign({},init);
      const h=new Headers(init.headers||{});
      h.set('X-Tg-Init-Data',tg.initData);
      init.headers=h;
    }
    return realFetch(input,init);

    });
  }

if(action==='save-payinfo') return (async()=>{try{await post('payinfo.set',{text:document.getElementById('payInfo').value});toast('✅ Saved');await load()}catch(e){toast('⚠️ '+e.message)}})(); if(action==='save-reminder') return (async()=>{try{await post('reminder.set',{enabled:document.getElementById('rEnabled').value==='on',hour:document.getElementById('rHour').value,utcOffset:document.getElementById('rOffset').value});toast('✅ Reminder saved');await load()}catch(e){toast('⚠️ '+e.message)}})(); if(action==='test-reminder') return (async()=>{try{await post('reminder.test');toast('✅ Weekly plan sent')}catch(e){toast('⚠️ '+e.message)}})();
  }
  boot();
})();
